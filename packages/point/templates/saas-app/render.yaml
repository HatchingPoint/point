services:
  - type: web
    name: point-saas-app
    runtime: bun
    buildCommand: bun install && bun run build
    startCommand: bun run serve
    envVars:
      - key: PORT
        value: "10000"
      - key: DATABASE_URL
        value: sqlite:./data/members.db
      - key: JWT_SECRET
        generateValue: true
