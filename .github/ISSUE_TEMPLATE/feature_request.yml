name: Feature request
description: Propose a language, compiler, or tooling improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem and proposed solution. For large changes, open a discussion first.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What pain does this solve? Who benefits (authors, agents, operators)?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Syntax sketch, CLI command, or behavior — links to examples welcome
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What else did you consider?

  - type: checkboxes
    id: willing
    attributes:
      label: Contribution
      options:
        - label: I am willing to open a PR for this (see CONTRIBUTING.md)
          required: false
