name: Publish

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Verify tag matches package version
        if: github.event_name == 'push'
        shell: bash
        run: |
          VERSION=$(bun -e "console.log(JSON.parse(await Bun.file('packages/point/package.json').text()).version)")
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$VERSION" != "$TAG" ]; then
            echo "Tag v$TAG does not match packages/point/package.json version $VERSION"
            exit 1
          fi
          LOGIC_VERSION=$(bun -e "console.log(JSON.parse(await Bun.file('packages/point-logic/package.json').text()).version)")
          echo "Publishing @hatchingpoint/point@$VERSION, @hatchingpoint/point-logic@$LOGIC_VERSION, and hatchingpoint.point@$VERSION"

      - name: Run CI
        run: bun run ci

      - name: Publish to npm
        if: github.event_name == 'push'
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: SKIP_CI=1 bun scripts/publish-npm.ts

      - name: Publish to VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "VSCE_PAT secret not set — skipping automated Marketplace publish."
            echo "Upload the VSIX manually: bun run vscode:package"
            echo "Then upload packages/point-vscode/point-*.vsix at https://marketplace.visualstudio.com/manage"
            exit 0
          fi
          SKIP_CI=1 bun scripts/publish-marketplace.ts

      - name: Publish to Open VSX
        env:
          OPENVSX_PAT: ${{ secrets.OPENVSX_PAT }}
        run: |
          if [ -z "$OPENVSX_PAT" ]; then
            echo "OPENVSX_PAT secret not set — skipping automated Open VSX publish."
            echo "Publish manually: bun run vscode:package && SKIP_CI=1 bun run publish:openvsx"
            echo "Or install from https://open-vsx.org/extension/hatchingpoint/point after upload"
            exit 0
          fi
          SKIP_CI=1 bun scripts/publish-openvsx.ts
